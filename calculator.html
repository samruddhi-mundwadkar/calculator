<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<style>
  :root {
    --bg: #f4f4f6;
    --card: #ffffff;
    --display-bg: #1e1e24;
    --display-text: #ffffff;
    --btn-bg: #eceef1;
    --btn-text: #1e1e24;
    --btn-op-bg: #ff9f0a;
    --btn-op-text: #ffffff;
    --btn-fn-bg: #d4d6da;
    --btn-fn-text: #1e1e24;
    --shadow: 0 8px 24px rgba(0,0,0,0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181c;
      --card: #232429;
      --display-bg: #000000;
      --display-text: #ffffff;
      --btn-bg: #3a3b40;
      --btn-text: #ffffff;
      --btn-op-bg: #ff9f0a;
      --btn-op-text: #ffffff;
      --btn-fn-bg: #59595e;
      --btn-fn-text: #ffffff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181c;
    --card: #232429;
    --display-bg: #000000;
    --display-text: #ffffff;
    --btn-bg: #3a3b40;
    --btn-text: #ffffff;
    --btn-op-bg: #ff9f0a;
    --btn-op-text: #ffffff;
    --btn-fn-bg: #59595e;
    --btn-fn-text: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
  }
  .calc {
    width: 100%;
    max-width: 320px;
    background: var(--card);
    border-radius: 24px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .display {
    background: var(--display-bg);
    color: var(--display-text);
    border-radius: 16px;
    padding: 24px 18px;
    margin-bottom: 16px;
    text-align: right;
    overflow: hidden;
  }
  .display .prev {
    font-size: 14px;
    opacity: 0.55;
    min-height: 18px;
    white-space: nowrap;
    overflow-x: auto;
  }
  .display .curr {
    font-size: 36px;
    font-weight: 500;
    white-space: nowrap;
    overflow-x: auto;
    margin-top: 4px;
  }
  .pad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    border: none;
    border-radius: 14px;
    font-size: 20px;
    padding: 18px 0;
    background: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
    transition: filter 0.1s ease;
  }
  button:active {
    filter: brightness(0.9);
  }
  button.op {
    background: var(--btn-op-bg);
    color: var(--btn-op-text);
    font-weight: 600;
  }
  button.fn {
    background: var(--btn-fn-bg);
    color: var(--btn-fn-text);
  }
  button.zero {
    grid-column: span 2;
  }
</style>
</head>
<body>
<div class="calc">
  <div class="display">
    <div class="prev" id="prev"></div>
    <div class="curr" id="curr">0</div>
  </div>
  <div class="pad">
    <button class="fn" data-action="clear">AC</button>
    <button class="fn" data-action="sign">±</button>
    <button class="fn" data-action="percent">%</button>
    <button class="op" data-action="divide">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-action="multiply">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-action="subtract">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-action="add">+</button>

    <button class="zero" data-num="0">0</button>
    <button data-action="decimal">.</button>
    <button class="op" data-action="equals">=</button>
  </div>
</div>

<script>
(function () {
  const prevEl = document.getElementById('prev');
  const currEl = document.getElementById('curr');

  let current = '0';
  let previous = null;
  let operator = null;
  let overwrite = true;

  const opSymbol = { add: '+', subtract: '−', multiply: '×', divide: '÷' };

  function updateDisplay() {
    currEl.textContent = current;
    prevEl.textContent = previous !== null && operator
      ? `${formatNum(previous)} ${opSymbol[operator]}`
      : '';
  }

  function formatNum(n) {
    if (n === null || n === undefined) return '';
    const num = typeof n === 'string' ? parseFloat(n) : n;
    if (!isFinite(num)) return 'Error';
    // Trim floating point noise
    return parseFloat(num.toPrecision(12)).toString();
  }

  function inputNumber(d) {
    if (overwrite) {
      current = d === '.' ? '0.' : d;
      overwrite = false;
      return;
    }
    if (d === '.' && current.includes('.')) return;
    if (current === '0' && d !== '.') {
      current = d;
    } else {
      current += d;
    }
  }

  function compute(a, b, op) {
    a = parseFloat(a);
    b = parseFloat(b);
    switch (op) {
      case 'add': return a + b;
      case 'subtract': return a - b;
      case 'multiply': return a * b;
      case 'divide': return b === 0 ? NaN : a / b;
      default: return b;
    }
  }

  function handleOperator(nextOp) {
    if (operator && !overwrite) {
      const result = compute(previous, current, operator);
      current = formatNum(result);
    }
    previous = current;
    operator = nextOp;
    overwrite = true;
  }

  function handleEquals() {
    if (operator === null || overwrite) return;
    const result = compute(previous, current, operator);
    current = formatNum(result);
    previous = null;
    operator = null;
    overwrite = true;
  }

  function handleClear() {
    current = '0';
    previous = null;
    operator = null;
    overwrite = true;
  }

  function handleSign() {
    if (current === '0') return;
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
  }

  function handlePercent() {
    current = formatNum(parseFloat(current) / 100);
  }

  document.querySelector('.pad').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;

    if (btn.dataset.num !== undefined) {
      inputNumber(btn.dataset.num);
    } else {
      switch (btn.dataset.action) {
        case 'decimal': inputNumber('.'); break;
        case 'clear': handleClear(); break;
        case 'sign': handleSign(); break;
        case 'percent': handlePercent(); break;
        case 'equals': handleEquals(); break;
        case 'add':
        case 'subtract':
        case 'multiply':
        case 'divide':
          handleOperator(btn.dataset.action);
          break;
      }
    }
    updateDisplay();
  });

  // Keyboard support
  window.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') inputNumber(e.key);
    else if (e.key === '.') inputNumber('.');
    else if (e.key === '+') handleOperator('add');
    else if (e.key === '-') handleOperator('subtract');
    else if (e.key === '*') handleOperator('multiply');
    else if (e.key === '/') { e.preventDefault(); handleOperator('divide'); }
    else if (e.key === 'Enter' || e.key === '=') handleEquals();
    else if (e.key === 'Escape') handleClear();
    else if (e.key === 'Backspace') {
      current = current.length > 1 ? current.slice(0, -1) : '0';
      overwrite = current === '0';
    } else return;
    updateDisplay();
  });

  updateDisplay();
})();
</script>
</body>
</html>
